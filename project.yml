name: NomimonoWars
options:
  bundleIdPrefix: com.tokyonasu
  deploymentTarget:
    iOS: "18.0"

packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    exactVersion: 11.13.0

settings:
  base:
    SWIFT_VERSION: 5.9
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: 21
    PRODUCT_BUNDLE_IDENTIFIER: com.tokyonasu.nomimonowars
    DEVELOPMENT_TEAM: 83VGKGSQUH
    CODE_SIGN_STYLE: Automatic

targets:
  NomimonoWars:
    type: application
    platform: iOS
    sources: [NomimonoWars]
    dependencies:
      - package: GoogleMobileAds
    settings:
      base:
        PRODUCT_NAME: NomimonoWars
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_GADApplicationIdentifier: "ca-app-pub-9404799280370656~5843914705"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: false

  NomimonoWarsScreenshot:
    type: application
    platform: iOS
    sources: [NomimonoWars]
    settings:
      base:
        INFOPLIST_FILE: NomimonoWars/Info.plist
        PRODUCT_NAME: NomimonoWars
        PRODUCT_BUNDLE_IDENTIFIER: com.tokyonasu.nomimonowars
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: SCREENSHOT_MODE
    info:
      path: NomimonoWars/Info.plist

  NomimonoWarsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [NomimonoWarsUITests]
    dependencies:
      - target: NomimonoWarsScreenshot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tokyonasu.nomimonowars.uitests
        GENERATE_INFOPLIST_FILE: YES
