name: Update App Review Contact

on:
  workflow_dispatch:
    inputs:
      version_string:
        description: App Store version
        required: true
        default: "1.0"

jobs:
  update:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up ASC API Key
        env:
          ASC_API_KEY_CONTENT: ${{ secrets.ASC_API_KEY_CONTENT }}
        run: echo "$ASC_API_KEY_CONTENT" | base64 -D > /tmp/asc_key.p8

      - name: Install Python dependencies
        run: pip3 install --break-system-packages PyJWT requests

      - name: Update review contact
        env:
          ASC_KEY_ID: WDXGY9WX55
          ASC_ISSUER_ID: 2be0734f-943a-4d61-9dc9-5d9045c46fec
          APP_VERSION: ${{ inputs.version_string }}
        run: python3 scripts/update_review_contact.py
