name: Capture and Upload Screenshots

on:
  workflow_dispatch:

jobs:
  screenshots:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: "iPhone 16 Pro Max"
            display: "APP_IPHONE_67"
          - device: "iPhone SE (3rd generation)"
            display: "APP_IPHONE_55"
          - device: "iPad Air 11-inch (M3)"
            display: "APP_IPAD_PRO_3GEN_129"

    steps:
    - uses: actions/checkout@v6

    - name: Select Xcode
      run: |
        XCODE_APP=$(ls /Applications/ | grep -E "^Xcode_2[6-9]|^Xcode_[3-9][0-9]" | sort -V | tail -1)
        if [ -n "$XCODE_APP" ]; then
          sudo xcode-select -s "/Applications/$XCODE_APP"
        else
          XCODE_APP=$(ls /Applications/ | grep "^Xcode_" | sort -V | tail -1)
          sudo xcode-select -s "/Applications/$XCODE_APP"
        fi
        xcodebuild -version

    - name: Install XcodeGen
      run: brew install xcodegen

    - name: Generate Xcode project
      run: xcodegen generate

    - name: Boot simulator
      run: |
        DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c "
        import json, sys
        data = json.load(sys.stdin)
        target = '${{ matrix.device }}'
        for runtime, devices in data['devices'].items():
            for d in devices:
                if d['name'] == target and d['isAvailable']:
                    print(d['udid'])
                    sys.exit(0)
        import subprocess
        runtimes = subprocess.check_output(['xcrun', 'simctl', 'list', 'runtimes', '-j']).decode()
        rt_data = json.loads(runtimes)
        ios_rt = [r for r in rt_data['runtimes'] if 'iOS' in r['name'] and r['isAvailable']][-1]
        result = subprocess.check_output(['xcrun', 'simctl', 'create', target, target.replace(' ', ''), ios_rt['identifier']]).decode().strip()
        print(result)
        ")
        echo "DEVICE_ID=$DEVICE_ID" >> $GITHUB_ENV
        xcrun simctl boot "$DEVICE_ID" || true
        sleep 5

    - name: Build for simulator
      run: |
        xcodebuild build-for-testing \
          -scheme NomimonoWars \
          -destination "platform=iOS Simulator,id=$DEVICE_ID" \
          CODE_SIGN_IDENTITY=- \
          CODE_SIGNING_REQUIRED=NO

    - name: Install and launch app
      run: |
        APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "NomimonoWars.app" -path "*/Debug-iphonesimulator/*" | head -1)
        echo "App path: $APP_PATH"
        xcrun simctl install "$DEVICE_ID" "$APP_PATH"
        xcrun simctl launch "$DEVICE_ID" com.tokyonasu.nomimonowars
        sleep 8

    - name: Capture screenshots
      run: |
        mkdir -p screenshots

        # Screenshot 1: 新商品 (default tab)
        xcrun simctl io "$DEVICE_ID" screenshot screenshots/01_shinshōhin.png
        echo "Captured: 01_shinshōhin.png"

        # Tap ランキング tab - use simctl with UI testing
        # We'll use the status bar tap coordinates approach
        # Instead, relaunch between tabs by sending deep links or use accessibility

        # For reliable tab switching, we run the UI test that taps tabs and takes simctl screenshots
        sleep 2

    - name: Run screenshot UI test
      run: |
        mkdir -p screenshots
        # Run the UI test - it will exercise the tabs
        xcodebuild test \
          -scheme NomimonoWars \
          -destination "platform=iOS Simulator,id=$DEVICE_ID" \
          -only-testing:NomimonoWarsUITests/ScreenshotTests/testCaptureScreenshots \
          CODE_SIGN_IDENTITY=- \
          CODE_SIGNING_REQUIRED=NO 2>&1 &
        TEST_PID=$!

        # Wait for app to launch and load content
        sleep 15

        # Take screenshots at intervals as the test progresses through tabs
        # The test sleeps between tabs giving us time to capture
        xcrun simctl io "$DEVICE_ID" screenshot screenshots/01_tab1.png
        sleep 6
        xcrun simctl io "$DEVICE_ID" screenshot screenshots/02_tab2.png
        sleep 6
        xcrun simctl io "$DEVICE_ID" screenshot screenshots/03_tab3.png
        sleep 5
        xcrun simctl io "$DEVICE_ID" screenshot screenshots/04_tab4.png
        sleep 5
        xcrun simctl io "$DEVICE_ID" screenshot screenshots/05_tab5.png
        sleep 5
        xcrun simctl io "$DEVICE_ID" screenshot screenshots/06_tab6.png

        # Wait for test to finish
        wait $TEST_PID || true

        echo "Screenshots captured:"
        ls -la screenshots/

    - name: Upload screenshots artifact
      uses: actions/upload-artifact@v4
      with:
        name: screenshots-${{ matrix.display }}
        path: screenshots/

    - name: Set up ASC API Key
      env:
        ASC_API_KEY_CONTENT: ${{ secrets.ASC_API_KEY_CONTENT }}
      run: |
        mkdir -p ~/.appstoreconnect/private_keys
        echo "$ASC_API_KEY_CONTENT" | base64 -D > /tmp/asc_key.p8

    - name: Install dependencies
      run: pip3 install --break-system-packages PyJWT requests

    - name: Upload to App Store Connect
      run: |
        python3 scripts/upload_screenshots.py \
          --display-type "${{ matrix.display }}" \
          --screenshots-dir screenshots
