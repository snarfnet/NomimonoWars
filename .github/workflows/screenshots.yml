name: Capture and Upload Screenshots

on:
  workflow_dispatch:

jobs:
  screenshots:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: "iPhone 16 Pro Max"
            display: "APP_IPHONE_69"
          - device: "iPhone 16 Plus"
            display: "APP_IPHONE_67"
          - device: "iPad Pro 12.9-inch (6th generation)"
            display: "APP_IPAD_PRO_3GEN_129"

    steps:
    - uses: actions/checkout@v6

    - name: Select Xcode
      run: |
        XCODE_APP=$(ls /Applications/ | grep -E "^Xcode_2[6-9]|^Xcode_[3-9][0-9]" | sort -V | tail -1)
        if [ -n "$XCODE_APP" ]; then
          sudo xcode-select -s "/Applications/$XCODE_APP"
        else
          XCODE_APP=$(ls /Applications/ | grep "^Xcode_" | sort -V | tail -1)
          sudo xcode-select -s "/Applications/$XCODE_APP"
        fi
        xcodebuild -version

    - name: Install XcodeGen
      run: brew install xcodegen

    - name: Generate Xcode project
      run: xcodegen generate

    - name: Boot simulator
      run: |
        DEVICE_ID=$(python3 -c "
        import json, subprocess, sys

        target = '${{ matrix.device }}'

        # Check existing devices first
        out = subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available', '-j']).decode()
        data = json.loads(out)
        for runtime, devices in data['devices'].items():
            for d in devices:
                if d['name'] == target and d['isAvailable']:
                    print(d['udid'])
                    sys.exit(0)

        # Not found - need to create. Get available device types and runtimes
        dt_out = subprocess.check_output(['xcrun', 'simctl', 'list', 'devicetypes', '-j']).decode()
        dt_data = json.loads(dt_out)
        rt_out = subprocess.check_output(['xcrun', 'simctl', 'list', 'runtimes', '-j']).decode()
        rt_data = json.loads(rt_out)

        ios_rt = [r for r in rt_data['runtimes'] if 'iOS' in r['name'] and r['isAvailable']][-1]

        # Find matching device type by name
        device_type_id = None
        for dt in dt_data['devicetypes']:
            if dt['name'] == target:
                device_type_id = dt['identifier']
                break

        # If exact match not found, search for partial match
        if not device_type_id:
            # For iPad Pro 12.9, try various names
            search = target.lower()
            for dt in dt_data['devicetypes']:
                if all(word in dt['name'].lower() for word in search.split()):
                    device_type_id = dt['identifier']
                    print(f'Partial match: {dt[\"name\"]}', file=sys.stderr)
                    break

        if not device_type_id:
            # List available iPad types for debug
            print('Available device types:', file=sys.stderr)
            for dt in dt_data['devicetypes']:
                if 'iPad' in dt['name'] or 'iPhone' in dt['name']:
                    print(f'  {dt[\"name\"]}: {dt[\"identifier\"]}', file=sys.stderr)
            sys.exit(1)

        result = subprocess.check_output([
            'xcrun', 'simctl', 'create', target, device_type_id, ios_rt['identifier']
        ]).decode().strip()
        print(result)
        ")
        echo "DEVICE_ID=$DEVICE_ID" >> $GITHUB_ENV
        xcrun simctl boot "$DEVICE_ID" || true
        sleep 5

    - name: Run UI test
      run: |
        xcodebuild test \
          -scheme NomimonoWars \
          -destination "platform=iOS Simulator,id=$DEVICE_ID" \
          -only-testing:NomimonoWarsUITests/ScreenshotTests/testCaptureScreenshots \
          CODE_SIGN_IDENTITY=- \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO || true

    - name: Extract screenshots
      run: |
        mkdir -p screenshots

        # Wait for completion marker (written by UI test on host /tmp)
        for i in $(seq 1 60); do
          if [ -f /tmp/screenshots_done ]; then
            echo "Screenshots complete marker found"
            break
          fi
          echo "Waiting for screenshots... ($i/60)"
          sleep 2
        done

        # Copy screenshots from host /tmp
        for f in 01_shinshōhin 02_ranking 03_news 04_nomilog 05_stats 06_bookmarks; do
          if [ -s "/tmp/screenshot_${f}.png" ]; then
            cp "/tmp/screenshot_${f}.png" "screenshots/${f}.png"
            SIZE=$(wc -c < "screenshots/${f}.png")
            echo "Extracted: ${f}.png ($SIZE bytes)"
          else
            echo "MISSING: ${f}.png"
          fi
        done

        echo "Final screenshots:"
        ls -la screenshots/

        # Fail if no screenshots found
        COUNT=$(ls screenshots/*.png 2>/dev/null | wc -l)
        if [ "$COUNT" -eq 0 ]; then
          echo "No screenshots captured!"
          exit 1
        fi

    - name: Upload screenshots artifact
      uses: actions/upload-artifact@v4
      with:
        name: screenshots-${{ matrix.display }}
        path: screenshots/

    - name: Set up ASC API Key
      env:
        ASC_API_KEY_CONTENT: ${{ secrets.ASC_API_KEY_CONTENT }}
      run: |
        mkdir -p ~/.appstoreconnect/private_keys
        echo "$ASC_API_KEY_CONTENT" | base64 -D > /tmp/asc_key.p8

    - name: Install dependencies
      run: pip3 install --break-system-packages PyJWT requests

    - name: Delete existing screenshots
      run: python3 scripts/delete_screenshots.py

    - name: Upload to App Store Connect
      run: |
        python3 scripts/upload_screenshots.py \
          --display-type "${{ matrix.display }}" \
          --screenshots-dir screenshots
